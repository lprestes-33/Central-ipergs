<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-labelledby="title desc">
  <title id="title">Central IPERGS</title>
  <desc id="desc">Cruz médica azul sobre fundo escuro</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0f2744"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="66" fill="none" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="96" cy="96" r="52" fill="none" stroke="#a855f7" stroke-opacity=".22" stroke-width="2"/>
  <g fill="url(#cross)" filter="url(#glow)">
    <rect x="77" y="38" width="38" height="116" rx="12"/>
    <rect x="38" y="77" width="116" height="38" rx="12"/>
  </g>
  <circle cx="96" cy="96" r="7" fill="#e0f2fe"/>
</svg>
